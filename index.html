    <!-- Global Error Handler - Prevents GTM errors from causing blank screen -->
    <script>
      (function() {
        // Helper to check if error is GTM-related
        function isGTMRelated(e) {
          var stack = '';
          var msg = e.message || '';
          
          // Get stack from multiple sources
          if (e.error && e.error.stack) stack = e.error.stack;
          else if (e.stack) stack = e.stack;
          
          // Direct GTM filename check
          if (e.filename && (e.filename.indexOf('googletagmanager.com') !== -1 || e.filename.indexOf('gtm.js') !== -1)) {
            return true;
          }
          
          // Stack trace contains GTM
          if (stack.indexOf('googletagmanager.com') !== -1 || stack.indexOf('gtm.js') !== -1) {
            return true;
          }
          
          // Common GTM null errors (when GTM tries to access DOM elements that don't exist)
          if (msg.indexOf("Cannot set properties of null") !== -1 || 
              msg.indexOf("Cannot read properties of null") !== -1 ||
              msg.indexOf("null is not an object") !== -1) {
            // Check if it's from an anonymous/inline script (GTM injects these)
            if (stack.indexOf('<anonymous>') !== -1 && stack.indexOf('gtm') !== -1) {
              return true;
            }
          }
          
          return false;
        }
        
        window.addEventListener('error', function(e) {
          if (isGTMRelated(e)) {
            console.warn('[GTM Suppressed]', e.message);
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason || {};
          var stack = reason.stack || '';
          if (stack.indexOf('googletagmanager.com') !== -1 || stack.indexOf('gtm.js') !== -1) {
            console.warn('[GTM Promise Suppressed]', reason.message);
            e.preventDefault();
          }
        });
        
        // Extra safety: override window.onerror as a fallback
        var originalOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          var stack = (error && error.stack) || '';
          if ((url && url.indexOf('gtm') !== -1) || 
              stack.indexOf('gtm.js') !== -1 || 
              stack.indexOf('googletagmanager.com') !== -1) {
            console.warn('[GTM onerror Suppressed]', msg);
            return true;
          }
          return originalOnError ? originalOnError.apply(this, arguments) : false;
        };
      })();
    </script>
